<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets List | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="layout-shell"></div>
    <main class="lg:ml-64 min-h-screen flex flex-col">
        <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-8 flex items-center justify-between sticky top-0 z-30">
            <h1 class="text-xl font-bold">Support Tickets</h1>
            <a href="tickets-create.html" class="bg-primary text-white px-4 py-2 rounded-lg font-medium hover:bg-primary/90 transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Open Ticket
            </a>
        </header>

        <div class="p-8 page-fade-in">
             <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 dark:bg-gray-700 text-xs text-gray-500 uppercase">
                            <tr>
                                <th class="px-6 py-4">Ticket ID</th>
                                <th class="px-6 py-4">Subject</th>
                                <th class="px-6 py-4">Customer</th>
                                <th class="px-6 py-4">Priority</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-gray-700" id="tickets-table-body">
                            <!-- Rows via JS -->
                        </tbody>
                    </table>
                </div>
             </div>
        </div>
    </main>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        function renderTickets() {
            const tableBody = document.getElementById('tickets-table-body');
            const tickets = DB.get('tickets');
            tableBody.innerHTML = tickets.map(t => `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <td class="px-6 py-4 font-bold text-gray-400">${t.id}</td>
                    <td class="px-6 py-4 font-medium">${t.subject}</td>
                    <td class="px-6 py-4 text-sm">${t.customer}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 text-[10px] font-bold uppercase rounded ${
                            t.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'
                        }">${t.priority}</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 text-xs rounded-full ${t.status === 'Open' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700'}">${t.status}</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <a href="tickets-show.html?id=${t.id}" class="text-primary hover:underline text-sm font-medium">View Thread</a>
                    </td>
                </tr>
            `).join('');
        }
        renderTickets();
    </script>
</body>
</html>
