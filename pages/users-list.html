<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users List | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="layout-shell"></div>

    <!-- Main Content Area (will be injected into layout later, but for now we repeat shell or use JS) -->
    <main class="lg:ml-64 min-h-screen flex flex-col">
        <!-- Topbar simplified for this file -->
        <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-8 flex items-center justify-between sticky top-0 z-30">
             <div class="flex items-center gap-4">
                <button id="sidebar-toggle" class="lg:hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="text-xl font-bold">Users Management</h1>
            </div>
            <a href="users-create.html" class="bg-primary text-white px-4 py-2 rounded-lg font-medium hover:bg-primary/90 transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Create User
            </a>
        </header>

        <div class="p-8 page-fade-in">
             <!-- DataTable Card -->
             <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                <div class="p-4 border-b border-gray-100 dark:border-gray-700 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="relative max-w-sm w-full">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </span>
                        <input type="text" id="user-search" placeholder="Search users..." class="w-full bg-gray-100 dark:bg-gray-700 border-none rounded-lg pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-primary transition">
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="exportUsers()" class="px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Export CSV
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 dark:bg-gray-700 text-xs text-gray-500 uppercase">
                            <tr>
                                <th class="px-6 py-4"><input type="checkbox" class="rounded"></th>
                                <th class="px-6 py-4 cursor-pointer" onclick="sortUsers('name')">Name</th>
                                <th class="px-6 py-4 cursor-pointer" onclick="sortUsers('email')">Email</th>
                                <th class="px-6 py-4 cursor-pointer" onclick="sortUsers('role')">Role</th>
                                <th class="px-6 py-4 cursor-pointer" onclick="sortUsers('status')">Status</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-gray-700" id="users-table-body">
                            <!-- Rows via JS -->
                        </tbody>
                    </table>
                </div>

                <div class="p-4 border-t border-gray-100 dark:border-gray-700 flex flex-col md:flex-row items-center justify-between gap-4">
                    <span class="text-sm text-gray-500">Showing 1 to 10 of 20 results</span>
                    <div class="flex gap-2">
                        <button class="px-3 py-1 border border-gray-200 dark:border-gray-700 rounded-md text-sm hover:bg-gray-50 dark:hover:bg-gray-700">Previous</button>
                        <button class="px-3 py-1 bg-primary text-white rounded-md text-sm">1</button>
                        <button class="px-3 py-1 border border-gray-200 dark:border-gray-700 rounded-md text-sm hover:bg-gray-50 dark:hover:bg-gray-700">2</button>
                        <button class="px-3 py-1 border border-gray-200 dark:border-gray-700 rounded-md text-sm hover:bg-gray-50 dark:hover:bg-gray-700">Next</button>
                    </div>
                </div>
             </div>
        </div>
    </main>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        let users = [];

        function renderUsers(filter = '') {
            const tableBody = document.getElementById('users-table-body');
            users = DB.get('users');

            const filtered = users.filter(u =>
                u.name.toLowerCase().includes(filter.toLowerCase()) ||
                u.email.toLowerCase().includes(filter.toLowerCase())
            );

            tableBody.innerHTML = filtered.map(u => `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <td class="px-6 py-4"><input type="checkbox" class="rounded"></td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <img src="${u.avatar}" class="w-8 h-8 rounded-full">
                            <span class="font-medium">${u.name}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-gray-500">${u.email}</td>
                    <td class="px-6 py-4">${u.role}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 text-xs rounded-full ${u.status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${u.status}</span>
                    </td>
                    <td class="px-6 py-4 text-right flex justify-end gap-2">
                        <a href="users-show.html?id=${u.id}" class="p-1 text-gray-400 hover:text-primary"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></a>
                        <a href="users-edit.html?id=${u.id}" class="p-1 text-gray-400 hover:text-blue-500"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></a>
                        <button onclick="deleteUser(${u.id})" class="p-1 text-gray-400 hover:text-red-500"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                DB.delete('users', id);
                UI.toast('User deleted successfully', 'success');
                renderUsers();
            }
        }

        function exportUsers() {
            Tables.exportCSV('users.csv', DB.get('users'));
        }

        document.getElementById('user-search').oninput = (e) => {
            renderUsers(e.target.value);
        };

        renderUsers();
    </script>
</body>
</html>
