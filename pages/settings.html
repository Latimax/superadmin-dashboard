<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="layout-shell"></div>
    <main class="lg:ml-64 p-8 page-fade-in">
        <h1 class="text-3xl font-bold mb-8">Settings</h1>

        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col md:flex-row">
            <!-- Settings Sidebar -->
            <div class="w-full md:w-64 border-r border-gray-100 dark:border-gray-700 p-4 space-y-2">
                <button class="tab-btn w-full text-left px-4 py-2 rounded-lg bg-primary/10 text-primary font-bold" data-tab-target="profile-settings">Profile</button>
                <button class="tab-btn w-full text-left px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-700" data-tab-target="appearance-settings">Appearance</button>
                <button class="tab-btn w-full text-left px-4 py-2 rounded-lg text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-700" data-tab-target="security-settings">Security</button>
            </div>

            <!-- Settings Content -->
            <div class="flex-1 p-8 tabs-container">
                <div id="profile-settings" class="tab-content space-y-6">
                    <h2 class="text-xl font-bold">Profile Information</h2>
                    <div class="flex items-center gap-6 mb-8">
                        <img src="https://i.pravatar.cc/150?u=1" class="w-20 h-20 rounded-full">
                        <button class="px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg text-sm font-bold">Change Avatar</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium mb-1">Display Name</label>
                            <input type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700" value="Admin User">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Email</label>
                            <input type="email" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700" value="admin@example.com">
                        </div>
                    </div>
                    <button onclick="UI.toast('Profile updated', 'success')" class="bg-primary text-white px-6 py-2 rounded-lg font-bold">Save Changes</button>
                </div>

                <div id="appearance-settings" class="tab-content hidden space-y-8">
                    <h2 class="text-xl font-bold">Appearance</h2>
                    <div>
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4">Theme Mode</h3>
                        <div class="flex gap-4">
                            <button onclick="Theme.setDarkMode(false)" class="flex-1 p-4 border border-gray-200 dark:border-gray-700 rounded-xl text-center hover:border-primary transition">
                                <span class="block text-2xl mb-2">☀️</span>
                                <span class="font-bold">Light</span>
                            </button>
                            <button onclick="Theme.setDarkMode(true)" class="flex-1 p-4 border border-gray-200 dark:border-gray-700 rounded-xl text-center hover:border-primary transition">
                                <span class="block text-2xl mb-2">🌙</span>
                                <span class="font-bold">Dark</span>
                            </button>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4">Accent Color</h3>
                        <div class="flex gap-4">
                            <button class="accent-picker w-10 h-10 rounded-full bg-blue-500" data-accent="blue"></button>
                            <button class="accent-picker w-10 h-10 rounded-full bg-emerald-500" data-accent="emerald"></button>
                            <button class="accent-picker w-10 h-10 rounded-full bg-violet-500" data-accent="violet"></button>
                        </div>
                    </div>
                </div>

                <div id="security-settings" class="tab-content hidden space-y-6">
                     <h2 class="text-xl font-bold">Security</h2>
                     <div class="space-y-4">
                        <button class="w-full text-left p-4 border border-gray-200 dark:border-gray-700 rounded-lg flex justify-between items-center hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                            <div>
                                <p class="font-bold">Change Password</p>
                                <p class="text-xs text-gray-500">Update your account password</p>
                            </div>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                        <button class="w-full text-left p-4 border border-gray-200 dark:border-gray-700 rounded-lg flex justify-between items-center hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                            <div>
                                <p class="font-bold">Two-Factor Authentication</p>
                                <p class="text-xs text-gray-500 font-medium text-red-500">Not enabled</p>
                            </div>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                     </div>
                </div>
            </div>
        </div>
    </main>
    <script src="../assets/js/app.js"></script>
</body>
</html>
