<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="layout-shell"></div>
    <main class="lg:ml-64 p-8 page-fade-in">
        <div class="max-w-3xl mx-auto">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-bold">Notifications</h1>
                <button onclick="markAllRead()" class="text-sm text-primary font-bold hover:underline">Mark all as read</button>
            </div>

            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden divide-y divide-gray-100 dark:divide-gray-700" id="notifications-full-list">
                <!-- Notifications via JS -->
            </div>
        </div>
    </main>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        function renderNotifs() {
            const list = document.getElementById('notifications-full-list');
            const notifs = DB.get('notifications');
            list.innerHTML = notifs.map(n => `
                <div class="p-6 flex gap-4 ${n.read ? 'opacity-60' : 'bg-primary/5'}">
                    <div class="w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center ${
                        n.type === 'warning' ? 'bg-yellow-100 text-yellow-600' : 'bg-blue-100 text-blue-600'
                    }">
                        ${n.type === 'warning' ? '!' : 'i'}
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold">${n.title}</h3>
                            <span class="text-xs text-gray-500">${n.time}</span>
                        </div>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">${n.message}</p>
                    </div>
                </div>
            `).join('');
        }
        function markAllRead() {
            const notifs = DB.get('notifications').map(n => ({ ...n, read: true }));
            DB.save('notifications', notifs);
            renderNotifs();
            UI.toast('All notifications marked as read', 'success');
        }
        renderNotifs();
    </script>
</body>
</html>
