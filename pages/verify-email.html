<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 page-fade-in text-center">
        <div class="w-16 h-16 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Check your email</h1>
        <p class="text-gray-500 dark:text-gray-400 mb-8">We've sent a verification link to your email address. Please click the link to verify your account.</p>

        <button onclick="UI.toast('Verification email resent!', 'info')" class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-2 rounded-lg transition duration-200 mb-4">
            Resend Email
        </button>

        <a href="login.html" class="text-sm text-gray-500 hover:text-primary transition font-medium">
            Back to Login
        </a>
    </div>

    <script src="../assets/js/app.js"></script>
</body>
</html>
