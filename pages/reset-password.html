<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 page-fade-in text-center">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Set New Password</h1>
        <p class="text-gray-500 dark:text-gray-400 mb-8">Your new password must be different from previous passwords.</p>

        <form id="reset-form" class="space-y-4 text-left">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">New Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition" placeholder="••••••••">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Confirm Password</label>
                <input type="password" id="confirm-password" required class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-2 rounded-lg transition duration-200">
                Reset Password
            </button>
        </form>
    </div>

    <script src="../assets/js/app.js"></script>
    <script>
        document.getElementById('reset-form').onsubmit = (e) => {
            e.preventDefault();
            UI.toast('Password reset successfully!', 'success');
            setTimeout(() => window.location.href = 'login.html', 1500);
        };
    </script>
</body>
</html>
