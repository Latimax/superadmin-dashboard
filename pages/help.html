<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Center | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <div id="layout-shell"></div>
    <main class="lg:ml-64 p-8 page-fade-in">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold mb-4 text-center">How can we help?</h1>
            <div class="relative mb-12 max-w-xl mx-auto">
                 <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" placeholder="Search for answers..." class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-800 shadow-sm outline-none focus:ring-2 focus:ring-primary transition">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
                <div class="space-y-4">
                    <h2 class="text-xl font-bold mb-4">Frequently Asked Questions</h2>
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
                        <button class="accordion-toggle w-full p-4 text-left font-bold flex justify-between items-center hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                            <span>How do I change my password?</span>
                            <svg class="w-4 h-4 chevron-icon transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div class="hidden p-4 text-sm text-gray-600 dark:text-gray-400 border-t border-gray-100 dark:border-gray-700">
                            Go to Settings > Security and click the "Change Password" button. You will need to provide your current password.
                        </div>
                    </div>
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
                        <button class="accordion-toggle w-full p-4 text-left font-bold flex justify-between items-center hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                            <span>Can I add multiple payment methods?</span>
                            <svg class="w-4 h-4 chevron-icon transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div class="hidden p-4 text-sm text-gray-600 dark:text-gray-400 border-t border-gray-100 dark:border-gray-700">
                            Yes, you can add multiple credit cards or PayPal accounts in the Billing section.
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="text-xl font-bold mb-4">Contact Support</h2>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700">
                        <form class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Subject</label>
                                <input type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Message</label>
                                <textarea rows="4" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700"></textarea>
                            </div>
                            <button type="button" onclick="UI.toast('Message sent!', 'success')" class="w-full bg-primary text-white py-2 rounded-lg font-bold">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="../assets/js/app.js"></script>
</body>
</html>
