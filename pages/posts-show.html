<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Post | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <div id="layout-shell"></div>
    <main class="lg:ml-64 p-8">
        <div class="max-w-4xl mx-auto">
            <div class="mb-8 flex justify-between items-center">
                <a href="posts-list.html" class="flex items-center text-primary hover:underline">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Back to Posts
                </a>
                <div id="action-area"></div>
            </div>
            <article class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                <div class="h-64 bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-400">
                    <svg class="w-24 h-24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div class="p-8 lg:p-12">
                    <div class="flex items-center gap-4 text-sm text-gray-500 mb-6">
                        <span id="post-date"></span>
                        <span>•</span>
                        <span id="post-author" class="font-bold text-gray-900 dark:text-white"></span>
                        <span id="post-status" class="px-2 py-0.5 rounded bg-blue-100 text-blue-700 text-[10px] uppercase font-bold"></span>
                    </div>
                    <h1 id="post-title" class="text-4xl font-extrabold mb-8 leading-tight"></h1>
                    <div id="post-content" class="prose dark:prose-invert max-w-none">
                        <!-- Content via JS -->
                    </div>
                </div>
            </article>
        </div>
    </main>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');
        if (postId) {
            const p = DB.get('posts').find(x => String(x.id) === postId);
            if (p) {
                document.getElementById('post-title').textContent = p.title;
                document.getElementById('post-date').textContent = p.date;
                document.getElementById('post-author').textContent = p.author;
                document.getElementById('post-status').textContent = p.status;
                document.getElementById('post-content').innerHTML = p.content;
                document.getElementById('action-area').innerHTML = `
                    <a href="posts-edit.html?id=${p.id}" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold">Edit Post</a>
                `;
            }
        }
    </script>
</body>
</html>
